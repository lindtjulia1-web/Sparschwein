<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Neon Studio Editor</title>
  <style>
    :root {
      /* Переменные для превью */
      --font-size: 60px;
      --text-align: center;
      --text-color: #FF00FF;
      --glow-gold: #ffd700;
      --glow-orange: #ff8c00;
      --spark-count: 35;
      --spark-velocity: 8;
      --spark-color: #00FFFF;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #111116;
      color: #e0e0e0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Панель настроек (Слева) */
    .sidebar {
      width: 360px;
      background: #181820;
      border-right: 1px solid #2a2a36;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    .sidebar h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #fff;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      display: flex;
      justify-content: space-between;
    }

    .control-group input[type="text"],
    .control-group select {
      background: #232330;
      border: 1px solid #3a3a4c;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .control-group input[type="color"] {
      border: none;
      width: 100%;
      height: 38px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: #ff00ff;
    }

    /* Область предпросмотра и кода (Справа) */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Превью */
    .preview-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      position: relative;
      overflow: hidden;
    }

    .lang-controls {
      position: absolute;
      top: 20px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .lang-btn {
      background: #20202d;
      color: #aaa;
      border: 1px solid #3a3a4c;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
      transition: 0.2s;
    }

    .lang-btn.active, .lang-btn:hover {
      background: #ff00ff;
      color: #fff;
      border-color: #ff00ff;
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.4);
    }

    /* Неоновые элементы */
    .neon-wrapper {
      display: block;
      text-align: var(--text-align);
      padding: 20px;
      cursor: pointer;
      position: relative;
      user-select: none;
      font-size: var(--font-size);
      color: var(--text-color);
      font-weight: bold;
      animation: neonFlash 1.5s ease-out forwards;
    }

    .neon-wrapper:hover {
      filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 15px var(--glow-gold)) drop-shadow(0 0 25px var(--glow-orange));
      transform: scale(1.05);
      animation: electricBuzz 0.15s infinite alternate;
    }

    @keyframes neonFlash {
      0% { opacity: 0; filter: brightness(10) drop-shadow(0 0 0px #fff); }
      15% { opacity: 1; filter: brightness(3) drop-shadow(0 0 30px var(--glow-gold)); }
      30% { filter: brightness(1) drop-shadow(0 0 15px var(--glow-orange)); }
      100% { opacity: 1; filter: none; }
    }

    @keyframes electricBuzz {
      from { transform: translate(0, 0); }
      to { transform: translate(1px, -1px); }
    }

    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--spark-color);
      box-shadow: 0 0 6px var(--glow-gold), 0 0 12px var(--glow-orange);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
    }

    /* Панель с кодом */
    .code-panel {
      height: 220px;
      background: #14141c;
      border-top: 1px solid #2a2a36;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .code-header span {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
    }

    .copy-btn {
      background: #2a2a3d;
      color: #fff;
      border: 1px solid #4a4a68;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .copy-btn:hover { background: #3a3a52; }

    textarea {
      flex: 1;
      background: #0d0d12;
      border: 1px solid #222230;
      color: #729fcf;
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      resize: none;
      border-radius: 4px;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Настройки -->
  <div class="sidebar">
    <h2>Текст и Шрифт</h2>
    <div class="control-group">
      <label>Текст надписи</label>
      <input type="text" id="textInput" value="очередная попытка …">
    </div>
    <div class="control-group">
      <label>Размер текста <span id="valFontSize">60px</span></label>
      <input type="range" id="fontSize" min="20" max="120" value="60">
    </div>

    <h2>Свечение и Цвет</h2>
    <div class="control-group">
      <label>Цвет текста</label>
      <input type="color" id="textColor" value="#FF00FF">
    </div>
    <div class="control-group">
      <label>Основное свечение</label>
      <input type="color" id="glowGold" value="#ffd700">
    </div>
    <div class="control-group">
      <label>Вторичное свечение</label>
      <input type="color" id="glowOrange" value="#ff8c00">
    </div>

    <h2>Настройки Искр</h2>
    <div class="control-group">
      <label>Количество искр <span id="valSparkCount">35</span></label>
      <input type="range" id="sparkCount" min="5" max="100" value="35">
    </div>
    <div class="control-group">
      <label>Скорость разлета <span id="valSparkVelocity">8</span></label>
      <input type="range" id="sparkVelocity" min="2" max="20" value="8">
    </div>
    <div class="control-group">
      <label>Цвет искры</label>
      <input type="color" id="sparkColor" value="#00FFFF">
    </div>
  </div>

  <!-- Главная область -->
  <div class="main-content">
    <div class="preview-container">
      <div class="lang-controls">
        <button class="lang-btn active" onclick="setLang('ru', this)">Русский</button>
        <button class="lang-btn" onclick="setLang('de', this)">Deutsch</button>
        <button class="lang-btn" onclick="setLang('fr', this)">Français</button>
      </div>

      <div class="neon-wrapper" id="neonElement">
        <span id="neonText">очередная попытка …</span>
      </div>
    </div>

    <!-- Генератор кода -->
    <div class="code-panel">
      <div class="code-header">
        <span>Сгенерированный HTML/CSS/JS код</span>
        <button class="copy-btn" onclick="copyCode()">Скопировать код</button>
      </div>
      <textarea id="codeOutput" readonly></textarea>
    </div>
  </div>

  <script>
    const LOCALES = {
      ru: "очередная попытка …",
      de: "Ein weiterer Versuch …",
      fr: "Une autre tentative …"
    };

    // Элементы управления
    const inputs = {
      text: document.getElementById('textInput'),
      fontSize: document.getElementById('fontSize'),
      textColor: document.getElementById('textColor'),
      glowGold: document.getElementById('glowGold'),
      glowOrange: document.getElementById('glowOrange'),
      sparkCount: document.getElementById('sparkCount'),
      sparkVelocity: document.getElementById('sparkVelocity'),
      sparkColor: document.getElementById('sparkColor')
    };

    const neonText = document.getElementById('neonText');
    const root = document.documentElement;
    const codeOutput = document.getElementById('codeOutput');

    // Обновление интерфейса
    function updateFX() {
      neonText.textContent = inputs.text.value;
      
      root.style.setProperty('--font-size', inputs.fontSize.value + 'px');
      root.style.setProperty('--text-color', inputs.textColor.value);
      root.style.setProperty('--glow-gold', inputs.glowGold.value);
      root.style.setProperty('--glow-orange', inputs.glowOrange.value);
      root.style.setProperty('--spark-count', inputs.sparkCount.value);
      root.style.setProperty('--spark-velocity', inputs.sparkVelocity.value);
      root.style.setProperty('--spark-color', inputs.sparkColor.value);

      document.getElementById('valFontSize').textContent = inputs.fontSize.value + 'px';
      document.getElementById('valSparkCount').textContent = inputs.sparkCount.value;
      document.getElementById('valSparkVelocity').textContent = inputs.sparkVelocity.value;

      generateCode();
    }

    // Слушатели событий
    Object.values(inputs).forEach(input => input.addEventListener('input', updateFX));

    // Смена языка
    function setLang(lang, btn) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (LOCALES[lang]) {
        inputs.text.value = LOCALES[lang];
        updateFX();
      }
    }

    // Эффект искр
    const container = document.getElementById('neonElement');
    container.addEventListener('click', (e) => {
      const count = parseInt(inputs.sparkCount.value);
      const velocityMultiplier = parseFloat(inputs.sparkVelocity.value);

      for (let i = 0; i < count; i++) {
        const spark = document.createElement('div');
        spark.classList.add('spark');
        document.body.appendChild(spark);

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * velocityMultiplier + 2;
        const destinationX = Math.cos(angle) * velocity * 25;
        const destinationY = Math.sin(angle) * velocity * 25;

        spark.style.left = `${e.clientX}px`;
        spark.style.top = `${e.clientY}px`;

        const animation = spark.animate([
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: `translate(${destinationX}px, ${destinationY}px) scale(0)`, opacity: 0 }
        ], {
          duration: 400 + Math.random() * 400,
          easing: 'cubic-bezier(0, .9, .57, 1)',
          fill: 'forwards'
        });

        animation.onfinish = () => spark.remove();
      }
    });

    // Генерация готового фрагмента
    function generateCode() {
      const fullCode = `<div id="FX_ROOT">
  <style>
    :root {
      --font-size: ${inputs.fontSize.value}px;
      --text-color: ${inputs.textColor.value};
      --glow-gold: ${inputs.glowGold.value};
      --glow-orange: ${inputs.glowOrange.value};
      --spark-count: ${inputs.sparkCount.value};
      --spark-velocity: ${inputs.sparkVelocity.value};
      --spark-color: ${inputs.sparkColor.value};
    }

    .neon-wrapper {
      display: block;
      text-align: center;
      padding: 15px;
      cursor: pointer;
      position: relative;
      font-size: var(--font-size);
      color: var(--text-color);
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-weight: bold;
      animation: neonFlash 1.5s ease-out forwards;
    }

    .neon-wrapper:hover {
      filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 15px var(--glow-gold)) drop-shadow(0 0 25px var(--glow-orange));
      transform: scale(1.05);
      animation: electricBuzz 0.15s infinite alternate;
    }

    @keyframes neonFlash {
      0% { opacity: 0; filter: brightness(10) drop-shadow(0 0 0px #fff); }
      15% { opacity: 1; filter: brightness(3) drop-shadow(0 0 30px var(--glow-gold)); }
      30% { filter: brightness(1) drop-shadow(0 0 15px var(--glow-orange)); }
      100% { opacity: 1; filter: none; }
    }

    @keyframes electricBuzz {
      from { transform: translate(0, 0); }
      to { transform: translate(1px, -1px); }
    }

    .spark {
      position: absolute;
      width: 4px; height: 4px;
      background: var(--spark-color);
      box-shadow: 0 0 6px var(--glow-gold), 0 0 12px var(--glow-orange);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
    }
  </style>

  <div class="neon-wrapper" id="neonElement">${inputs.text.value}</div>

  <script>
    document.getElementById('neonElement').addEventListener('click', (e) => {
      const rootStyles = getComputedStyle(document.documentElement);
      const count = parseInt(rootStyles.getPropertyValue('--spark-count')) || 25;
      const velocityMultiplier = parseFloat(rootStyles.getPropertyValue('--spark-velocity')) || 6;

      for (let i = 0; i < count; i++) {
        const spark = document.createElement('div');
        spark.classList.add('spark');
        document.body.appendChild(spark);

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * velocityMultiplier + 2;
        const destinationX = Math.cos(angle) * velocity * 25;
        const destinationY = Math.sin(angle) * velocity * 25;

        spark.style.left = \`\${e.clientX}px\`;
        spark.style.top = \`\${e.clientY}px\`;

        const animation = spark.animate([
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: \`translate(\${destinationX}px, \${destinationY}px) scale(0)\`, opacity: 0 }
        ], {
          duration: 400 + Math.random() * 400,
          easing: 'cubic-bezier(0, .9, .57, 1)',
          fill: 'forwards'
        });

        animation.onfinish = () => spark.remove();
      }
    });
  <\/script>
</div>`;

      codeOutput.value = fullCode;
    }

    function copyCode() {
      codeOutput.select();
      document.execCommand('copy');
      alert('Код скопирован в буфер обмена!');
    }

    // Первичная инициализация
    updateFX();
  </script>
</body>
</html>

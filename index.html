<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Neon Text FX Editor</title>
  <!-- Google Fonts из Скриншота 3 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Manrope:wght@700&family=Montserrat:wght@700&family=Rubik:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-family: system-ui, -apple-system, sans-serif;
      --font-size: 60px;
      --text-color: #FF00FF;
      --glow-gold: #ffd700;
      --glow-orange: #ff8c00;
      --spark-count: 35;
      --spark-velocity: 8;
      --spark-color: #00FFFF;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #11141c;
      color: #e0e6ed;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Боковая панель управления (Стиль Скриншота 2) */
    .sidebar {
      width: 320px;
      background: #151821;
      border-right: 1px solid #222634;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8fa0b5;
      margin-top: 8px;
      margin-bottom: 4px;
      padding-bottom: 6px;
      border-bottom: 1px solid #222634;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .control-row label {
      font-size: 13px;
      color: #c5d1e0;
      white-space: nowrap;
    }

    .control-row input[type="text"],
    .control-row select {
      background: #1e2230;
      border: 1px solid #2d3346;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      width: 150px;
    }

    .control-row input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid #2d3346;
      width: 32px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    .control-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .control-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

    /* Ползунки как на Скриншоте 2 */
    .control-row input[type="range"] {
      width: 140px;
      accent-color: #4d7cff;
      height: 4px;
    }

    /* Правая часть (Предпросмотр и Код) */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .preview-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0d13;
      position: relative;
    }

    .lang-controls {
      position: absolute;
      top: 16px;
      display: flex;
      gap: 6px;
    }

    .lang-btn {
      background: #1a1e2b;
      color: #8fa0b5;
      border: 1px solid #2b3247;
      padding: 5px 12px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
    }

    .lang-btn.active, .lang-btn:hover {
      background: #4d7cff;
      color: #fff;
      border-color: #4d7cff;
    }

    /* Неоновый текст */
    .neon-wrapper {
      display: block;
      text-align: center;
      padding: 20px;
      cursor: pointer;
      position: relative;
      user-select: none;
      font-family: var(--font-family);
      font-size: var(--font-size);
      color: var(--text-color);
      font-weight: bold;
      animation: neonFlash 1.5s ease-out forwards;
    }

    .neon-wrapper:hover {
      filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 15px var(--glow-gold)) drop-shadow(0 0 25px var(--glow-orange));
      transform: scale(1.03);
      animation: electricBuzz 0.15s infinite alternate;
    }

    @keyframes neonFlash {
      0% { opacity: 0; filter: brightness(10) drop-shadow(0 0 0px #fff); }
      15% { opacity: 1; filter: brightness(3) drop-shadow(0 0 30px var(--glow-gold)); }
      30% { filter: brightness(1) drop-shadow(0 0 15px var(--glow-orange)); }
      100% { opacity: 1; filter: none; }
    }

    @keyframes electricBuzz {
      from { transform: translate(0, 0); }
      to { transform: translate(1px, -1px); }
    }

    .spark {
      position: absolute;
      width: 4px; height: 4px;
      background: var(--spark-color);
      box-shadow: 0 0 6px var(--glow-gold), 0 0 12px var(--glow-orange);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
    }

    /* Панель Кода */
    .code-panel {
      height: 200px;
      background: #151821;
      border-top: 1px solid #222634;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .code-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background: #232838;
      color: #fff;
      border: 1px solid #333a52;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-action:hover {
      background: #4d7cff;
      border-color: #4d7cff;
    }

    textarea {
      flex: 1;
      background: #0b0d13;
      border: 1px solid #222634;
      color: #729fcf;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      resize: none;
      border-radius: 4px;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Настройки в стиле Скриншота 2 -->
  <div class="sidebar">
    <div class="section-title">Текст и Шрифт</div>
    <div class="control-row">
      <label>Текст надписи</label>
      <input type="text" id="textInput" value="очередная попытка …">
    </div>
    <div class="control-row">
      <label>Шрифт</label>
      <select id="fontFamily">
        <option value="system-ui, sans-serif">Системный</option>
        <option value="'Rubik', sans-serif">Rubik</option>
        <option value="'Manrope', sans-serif">Manrope</option>
        <option value="'Montserrat', sans-serif">Montserrat</option>
        <option value="'Comfortaa', cursive">Comfortaa</option>
      </select>
    </div>
    <div class="control-row">
      <label>Размер текста</label>
      <input type="range" id="fontSize" min="20" max="120" value="60">
    </div>

    <div class="section-title">Свечение и Цвет</div>
    <div class="control-row">
      <label>Цвет текста</label>
      <input type="color" id="textColor" value="#FF00FF">
    </div>
    <div class="control-row">
      <label>Основное свечение</label>
      <input type="color" id="glowGold" value="#ffd700">
    </div>
    <div class="control-row">
      <label>Вторичное свечение</label>
      <input type="color" id="glowOrange" value="#ff8c00">
    </div>

    <div class="section-title">Настройки Искр</div>
    <div class="control-row">
      <label>Количество искр</label>
      <input type="range" id="sparkCount" min="5" max="100" value="35">
    </div>
    <div class="control-row">
      <label>Скорость разлета</label>
      <input type="range" id="sparkVelocity" min="2" max="20" value="8">
    </div>
    <div class="control-row">
      <label>Цвет искры</label>
      <input type="color" id="sparkColor" value="#00FFFF">
    </div>
  </div>

  <!-- Область предпросмотра -->
  <div class="main-content">
    <div class="preview-container">
      <div class="lang-controls">
        <button class="lang-btn active" onclick="setLang('ru', this)">Русский</button>
        <button class="lang-btn" onclick="setLang('de', this)">Deutsch</button>
        <button class="lang-btn" onclick="setLang('fr', this)">Français</button>
      </div>

      <div class="neon-wrapper" id="neonElement">
        <span id="neonText">очередная попытка …</span>
      </div>
    </div>

    <!-- Кнопка и генерация кода (Скриншот 4) -->
    <div class="code-panel">
      <div class="code-buttons">
        <button class="btn-action" onclick="copyCode()">Скопировать HTML-код</button>
        <button class="btn-action" onclick="copyGeniallyCode()">Код для Genially (iframe srcdoc)</button>
      </div>
      <textarea id="codeOutput" readonly></textarea>
    </div>
  </div>

  <script>
    const LOCALES = {
      ru: "очередная попытка …",
      de: "Ein weiterer Versuch …",
      fr: "Une autre tentative …"
    };

    const inputs = {
      text: document.getElementById('textInput'),
      fontFamily: document.getElementById('fontFamily'),
      fontSize: document.getElementById('fontSize'),
      textColor: document.getElementById('textColor'),
      glowGold: document.getElementById('glowGold'),
      glowOrange: document.getElementById('glowOrange'),
      sparkCount: document.getElementById('sparkCount'),
      sparkVelocity: document.getElementById('sparkVelocity'),
      sparkColor: document.getElementById('sparkColor')
    };

    const neonText = document.getElementById('neonText');
    const root = document.documentElement;
    const codeOutput = document.getElementById('codeOutput');

    function getBaseHTML() {
      return `<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Manrope:wght@700&family=Montserrat:wght@700&family=Rubik:wght@700&display=swap" rel="stylesheet">
<div id="FX_ROOT">
  <style>
    :root {
      --font-family: ${inputs.fontFamily.value};
      --font-size: ${inputs.fontSize.value}px;
      --text-color: ${inputs.textColor.value};
      --glow-gold: ${inputs.glowGold.value};
      --glow-orange: ${inputs.glowOrange.value};
      --spark-count: ${inputs.sparkCount.value};
      --spark-velocity: ${inputs.sparkVelocity.value};
      --spark-color: ${inputs.sparkColor.value};
    }

    .neon-wrapper {
      display: block;
      text-align: center;
      padding: 15px;
      cursor: pointer;
      position: relative;
      font-family: var(--font-family);
      font-size: var(--font-size);
      color: var(--text-color);
      font-weight: bold;
      animation: neonFlash 1.5s ease-out forwards;
    }

    .neon-wrapper:hover {
      filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 15px var(--glow-gold)) drop-shadow(0 0 25px var(--glow-orange));
      transform: scale(1.03);
      animation: electricBuzz 0.15s infinite alternate;
    }

    @keyframes neonFlash {
      0% { opacity: 0; filter: brightness(10) drop-shadow(0 0 0px #fff); }
      15% { opacity: 1; filter: brightness(3) drop-shadow(0 0 30px var(--glow-gold)); }
      30% { filter: brightness(1) drop-shadow(0 0 15px var(--glow-orange)); }
      100% { opacity: 1; filter: none; }
    }

    @keyframes electricBuzz {
      from { transform: translate(0, 0); }
      to { transform: translate(1px, -1px); }
    }

    .spark {
      position: absolute;
      width: 4px; height: 4px;
      background: var(--spark-color);
      box-shadow: 0 0 6px var(--glow-gold), 0 0 12px var(--glow-orange);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
    }
  </style>

  <div class="neon-wrapper" id="neonElement">${inputs.text.value}</div>

  <script>
    document.getElementById('neonElement').addEventListener('click', (e) => {
      const rootStyles = getComputedStyle(document.documentElement);
      const count = parseInt(rootStyles.getPropertyValue('--spark-count')) || 25;
      const velocityMultiplier = parseFloat(rootStyles.getPropertyValue('--spark-velocity')) || 6;

      for (let i = 0; i < count; i++) {
        const spark = document.createElement('div');
        spark.classList.add('spark');
        document.body.appendChild(spark);

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * velocityMultiplier + 2;
        const destinationX = Math.cos(angle) * velocity * 25;
        const destinationY = Math.sin(angle) * velocity * 25;

        spark.style.left = \`\${e.clientX}px\`;
        spark.style.top = \`\${e.clientY}px\`;

        const animation = spark.animate([
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: \`translate(\${destinationX}px, \${destinationY}px) scale(0)\`, opacity: 0 }
        ], {
          duration: 400 + Math.random() * 400,
          easing: 'cubic-bezier(0, .9, .57, 1)',
          fill: 'forwards'
        });

        animation.onfinish = () => spark.remove();
      }
    });
  <\/script>
</div>`;
    }

    function updateFX() {
      neonText.textContent = inputs.text.value;
      
      root.style.setProperty('--font-family', inputs.fontFamily.value);
      root.style.setProperty('--font-size', inputs.fontSize.value + 'px');
      root.style.setProperty('--text-color', inputs.textColor.value);
      root.style.setProperty('--glow-gold', inputs.glowGold.value);
      root.style.setProperty('--glow-orange', inputs.glowOrange.value);
      root.style.setProperty('--spark-count', inputs.sparkCount.value);
      root.style.setProperty('--spark-velocity', inputs.sparkVelocity.value);
      root.style.setProperty('--spark-color', inputs.sparkColor.value);

      codeOutput.value = getBaseHTML();
    }

    Object.values(inputs).forEach(input => input.addEventListener('input', updateFX));

    function setLang(lang, btn) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (LOCALES[lang]) {
        inputs.text.value = LOCALES[lang];
        updateFX();
      }
    }

    // Спарт эффекты
    document.getElementById('neonElement').addEventListener('click', (e) => {
      const count = parseInt(inputs.sparkCount.value);
      const velocityMultiplier = parseFloat(inputs.sparkVelocity.value);

      for (let i = 0; i < count; i++) {
        const spark = document.createElement('div');
        spark.classList.add('spark');
        document.body.appendChild(spark);

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * velocityMultiplier + 2;
        const destinationX = Math.cos(angle) * velocity * 25;
        const destinationY = Math.sin(angle) * velocity * 25;

        spark.style.left = `${e.clientX}px`;
        spark.style.top = `${e.clientY}px`;

        const animation = spark.animate([
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: `translate(${destinationX}px, ${destinationY}px) scale(0)`, opacity: 0 }
        ], {
          duration: 400 + Math.random() * 400,
          easing: 'cubic-bezier(0, .9, .57, 1)',
          fill: 'forwards'
        });

        animation.onfinish = () => spark.remove();
      }
    });

    function copyCode() {
      codeOutput.value = getBaseHTML();
      codeOutput.select();
      document.execCommand('copy');
      alert('HTML-код скопирован!');
    }

    // Генерация кода для Genially (iframe srcdoc)
    function copyGeniallyCode() {
      const rawHTML = getBaseHTML();
      const escapedHTML = rawHTML
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const geniallyIframe = `<iframe width="100%" height="300" frameborder="0" scrolling="no" srcdoc="${escapedHTML}"></iframe>`;
      
      codeOutput.value = geniallyIframe;
      codeOutput.select();
      document.execCommand('copy');
      alert('Код для Genially скопирован!');
    }

    updateFX();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-FX Letter Studio Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Creepster&family=Danfo&family=Emblema+One&family=Fascinate+Inline&family=Great+Vibes&family=Inter:wght@400;700&family=Manrope:wght@700&family=Montserrat:wght@700&family=Orbitron:wght@600;900&family=Oswald:wght@400;600&family=Press+Start+2P&family=Rubik:wght@700&family=UnifrakturMaguntia&family=Yellowtail&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-family: 'Comfortaa', cursive;
      --font-size: 60px;
      --text-color: #ffffff;
      --glow-color-1: #ff6600;
      --glow-color-2: #ff0000;
      --bg-color: rgba(0, 0, 0, 0);
      --container-width: 100%;
      --container-height: 250px;
      --flicker-speed: 1.8s;
      --wave-speed: 1.6s;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f111a;
      color: #e0e6ed;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 340px;
      min-width: 340px;
      background: #151824;
      border-right: 1px solid #222638;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8fa0b5;
      margin-top: 8px;
      margin-bottom: 2px;
      padding-bottom: 4px;
      border-bottom: 1px solid #222638;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .control-row label {
      font-size: 12px;
      color: #c5d1e0;
      white-space: nowrap;
    }

    .control-row input[type="text"],
    .control-row select {
      background: #1c2030;
      border: 1px solid #2d3348;
      color: #fff;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      width: 160px;
    }

    .control-row input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid #2d3348;
      width: 32px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    .control-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .control-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

    .control-row input[type="range"] {
      width: 130px;
      accent-color: #4d7cff;
      height: 4px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      color: #d1dbe8;
      user-select: none;
    }

    .checkbox-item input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      background: #1c2030;
      border: 1px solid #3b4460;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .checkbox-item input[type="checkbox"]:checked {
      background: #4d7cff;
      border-color: #4d7cff;
    }

    .checkbox-item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: #fff;
      font-size: 11px;
      top: -2px;
      left: 3px;
      font-weight: bold;
    }

    .fx-checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #10121c;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #222638;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .preview-container-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #12141d;
      background-image: 
        linear-gradient(45deg, #181b28 25%, transparent 25%), 
        linear-gradient(-45deg, #181b28 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #181b28 75%), 
        linear-gradient(-45deg, transparent 75%, #181b28 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      position: relative;
      overflow: auto;
      padding: 20px;
    }

    .preview-container {
      width: var(--container-width);
      height: var(--container-height);
      background: var(--bg-color);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #3b4460;
      border-radius: 8px;
      transition: width 0.2s, height 0.2s;
    }

    #fxCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .text-container {
      position: relative;
      z-index: 2;
      display: inline-block;
      text-align: center;
      font-family: var(--font-family);
      font-size: var(--font-size);
      color: var(--text-color);
      font-weight: bold;
      user-select: none;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 95%;
    }

    .char {
      display: inline-block;
      position: relative;
      transition: transform 0.15s ease-out, color 0.3s, filter 0.3s, opacity 0.5s;
      cursor: pointer;
    }

    .has-shadow { text-shadow: 3px 5px 10px rgba(0, 0, 0, 0.8); }
    .has-glow { filter: drop-shadow(0 0 12px var(--glow-color-1)) drop-shadow(0 0 25px var(--glow-color-2)); }

    .char.fx-shake:hover { animation: charShake 0.08s infinite alternate; }
    @keyframes charShake {
      0% { transform: translate(-3px, -2px) rotate(-4deg); }
      100% { transform: translate(3px, 2px) rotate(4deg); }
    }

    .char.fx-flicker {
      animation: charFlicker var(--flicker-speed) infinite ease-in-out;
      animation-delay: calc(var(--char-index) * 0.12s);
    }
    @keyframes charFlicker {
      0%, 100% { opacity: 1; filter: brightness(1); }
      30% { opacity: 0.3; filter: brightness(0.5); }
      35% { opacity: 0.9; filter: brightness(1.2); }
      70% { opacity: 0.4; filter: brightness(0.6); }
    }

    .char.fx-wave {
      animation: charWave var(--wave-speed) infinite ease-in-out;
      animation-delay: calc(var(--char-index) * 0.15s);
    }
    @keyframes charWave {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.35) translateY(-5px); }
    }

    .char.fx-melted {
      transform: translateY(50px) scaleY(0.05) scaleX(2) !important;
      opacity: 0 !important;
      filter: blur(8px) brightness(2) !important;
      pointer-events: none;
    }

    .code-panel {
      height: 180px;
      background: #151824;
      border-top: 1px solid #222638;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .code-buttons { display: flex; gap: 8px; }

    .btn-action {
      background: #202536;
      color: #fff;
      border: 1px solid #313850;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }

    .btn-action:hover {
      background: #4d7cff;
      border-color: #4d7cff;
    }

    textarea {
      flex: 1;
      background: #08090e;
      border: 1px solid #222638;
      color: #61afef;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      resize: none;
      border-radius: 4px;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="section-title">Текст и Шрифт</div>
    <div class="control-row">
      <label>Текст</label>
      <input type="text" id="textInput" value="SGV">
    </div>
    <div class="control-row">
      <label>Шрифт</label>
      <select id="fontFamily">
        <option value="'Comfortaa', cursive">Comfortaa</option>
        <option value="system-ui, sans-serif">Системный</option>
        <option value="'Rubik', sans-serif">Rubik</option>
        <option value="'Manrope', sans-serif">Manrope</option>
        <option value="'Montserrat', sans-serif">Montserrat</option>
        <option value="'Inter', sans-serif">Business / Calm</option>
        <option value="'Great Vibes', cursive">Fancy / Valentines</option>
        <option value="'Yellowtail', cursive">Cute / Childlike</option>
        <option value="'UnifrakturMaguntia', cursive">Artistic / Vintage</option>
        <option value="'Emblema One', cursive">Loud</option>
        <option value="'Orbitron', sans-serif">Futuristic / Innovative</option>
        <option value="'Oswald', sans-serif">Stiff / Rugged</option>
        <option value="'Fascinate Inline', cursive">Awkward</option>
        <option value="'Danfo', cursive">Excited</option>
        <option value="'Press Start 2P', cursive">Holi</option>
        <option value="'Creepster', cursive">Halloween</option>

    <div class="control-row">
      <label>Размер текста</label>
      <input type="range" id="fontSize" min="20" max="150" value="75">
    </div>

    <div class="section-title">Размер блока</div>
    <div class="control-row">
      <label>Ширина блока (%)</label>
      <input type="range" id="containerWidth" min="20" max="100" value="100">
    </div>
    <div class="control-row">
      <label>Высота блока (px)</label>
      <input type="range" id="containerHeight" min="100" max="600" value="200">
    </div>

    <div class="section-title">Фон и Свечение</div>
    <div class="control-row">
      <label>Цвет фона</label>
      <input type="color" id="bgColor" value="#000000">
    </div>
    <div class="control-row">
      <label>Прозрачность фона</label>
      <input type="range" id="bgOpacity" min="0" max="100" value="0">
    </div>

    <div class="control-row">
      <label>Основное свечение</label>
      <input type="color" id="glowColor1" value="#ff6600">
    </div>
    <div class="control-row">
      <label>Вторичное свечение</

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Multi-FX Letter Studio Fixed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Manrope:wght@700&family=Montserrat:wght@700&family=Rubik:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-family: 'Comfortaa', cursive;
      --font-size: 60px;
      --text-color: #ffffff;
      --glow-color-1: #00ffff;
      --glow-color-2: #ff00ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f111a;
      color: #e0e6ed;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 350px;
      background: #151824;
      border-right: 1px solid #222638;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8fa0b5;
      margin-top: 8px;
      margin-bottom: 2px;
      padding-bottom: 4px;
      border-bottom: 1px solid #222638;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .control-row label {
      font-size: 12px;
      color: #c5d1e0;
      white-space: nowrap;
    }

    .control-row input[type="text"],
    .control-row select {
      background: #1c2030;
      border: 1px solid #2d3348;
      color: #fff;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      width: 150px;
    }

    .control-row input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid #2d3348;
      width: 32px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    .control-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .control-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

    .control-row input[type="range"] {
      width: 130px;
      accent-color: #4d7cff;
      height: 4px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      color: #d1dbe8;
      user-select: none;
    }

    .checkbox-item input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      background: #1c2030;
      border: 1px solid #3b4460;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .checkbox-item input[type="checkbox"]:checked {
      background: #4d7cff;
      border-color: #4d7cff;
    }

    .checkbox-item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: #fff;
      font-size: 11px;
      top: -2px;
      left: 3px;
      font-weight: bold;
    }

    .fx-checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #10121c;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #222638;
    }

    .lang-group {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .lang-btn {
      flex: 1;
      background: #1c2030;
      color: #8fa0b5;
      border: 1px solid #2d3348;
      padding: 5px 0;
      cursor: pointer;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
    }

    .lang-btn.active, .lang-btn:hover {
      background: #4d7cff;
      color: #fff;
      border-color: #4d7cff;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08090e;
      position: relative;
      overflow: hidden;
    }

    #fxCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .text-container {
      position: relative;
      z-index: 2;
      display: inline-block;
      text-align: center;
      font-family: var(--font-family);
      font-size: var(--font-size);
      color: var(--text-color);
      font-weight: bold;
      user-select: none;
      white-space: pre-wrap;
    }

    .char {
      display: inline-block;
      position: relative;
      transition: transform 0.15s ease-out, color 0.3s, filter 0.3s, opacity 0.5s;
      cursor: pointer;
    }

    .has-shadow { text-shadow: 3px 5px 10px rgba(0, 0, 0, 0.8); }
    .has-glow { filter: drop-shadow(0 0 12px var(--glow-color-1)) drop-shadow(0 0 25px var(--glow-color-2)); }

    .char.fx-shake:hover { animation: charShake 0.08s infinite alternate; }
    @keyframes charShake {
      0% { transform: translate(-3px, -2px) rotate(-4deg); }
      100% { transform: translate(3px, 2px) rotate(4deg); }
    }

    .char.fx-melted {
      transform: translateY(50px) scaleY(0.05) scaleX(2) !important;
      opacity: 0 !important;
      filter: blur(8px) brightness(2) !important;
      pointer-events: none;
    }

    .code-panel {
      height: 170px;
      background: #151824;
      border-top: 1px solid #222638;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .code-buttons { display: flex; gap: 8px; }

    .btn-action {
      background: #202536;
      color: #fff;
      border: 1px solid #313850;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }

    .btn-action:hover {
      background: #4d7cff;
      border-color: #4d7cff;
    }

    textarea {
      flex: 1;
      background: #08090e;
      border: 1px solid #222638;
      color: #61afef;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      resize: none;
      border-radius: 4px;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="section-title">Язык интерфейса</div>
    <div class="lang-group">
      <button class="lang-btn active" onclick="setLang('ru', this)">Русский</button>
      <button class="lang-btn" onclick="setLang('en', this)">English</button>
      <button class="lang-btn" onclick="setLang('de', this)">Deutsch</button>
      <button class="lang-btn" onclick="setLang('fr', this)">Français</button>
    </div>

    <div class="section-title">Текст и Шрифт</div>
    <div class="control-row">
      <label>Текст надписи</label>
      <input type="text" id="textInput" value="живой текст …">
    </div>
    <div class="control-row">
      <label>Шрифт</label>
      <select id="fontFamily">
        <option value="'Comfortaa', cursive">Comfortaa</option>
        <option value="system-ui, sans-serif">Системный</option>
        <option value="'Rubik', sans-serif">Rubik</option>
        <option value="'Manrope', sans-serif">Manrope</option>
        <option value="'Montserrat', sans-serif">Montserrat</option>
      </select>
    </div>
    <div class="control-row">
      <label>Размер текста</label>
      <input type="range" id="fontSize" min="20" max="120" value="60">
    </div>

    <div class="section-title">Свечение и Тень</div>
    <label class="checkbox-item"><input type="checkbox" id="enableGlow" checked> Включить свечение</label>
    <div class="control-row">
      <label>Основное свечение</label>
      <input type="color" id="glowColor1" value="#00ffff">
    </div>
    <div class="control-row">
      <label>Вторичное свечение</label>
      <input type="color" id="glowColor2" value="#ff00ff">
    </div>
    <label class="checkbox-item"><input type="checkbox" id="enableShadow"> Тень под буквами</label>

    <div class="section-title">Интерактив и Атмосфера</div>
    <div class="fx-checkbox-list">
      <label class="checkbox-item"><input type="checkbox" value="scared" class="fx-option"> Трусливые буквы (при курсоре)</label>
      <label class="checkbox-item"><input type="checkbox" value="shake" class="fx-option"> Дрожание букв</label>
      <label class="checkbox-item"><input type="checkbox" value="melt" class="fx-option"> Буквы тают (исчезают)</label>
      <label class="checkbox-item"><input type="checkbox" value="sparks" class="fx-option" checked> Всплеск искр (при курсоре)</label>
      <label class="checkbox-item"><input type="checkbox" value="fire" class="fx-option"> Постоянный Огонь вокруг</label>
      <label class="checkbox-item"><input type="checkbox" value="snow" class="fx-option"> Постоянный Снегопад</label>
      <label class="checkbox-item"><input type="checkbox" value="rain" class="fx-option" checked> Постоянный Ливень</label>
      <label class="checkbox-item"><input type="checkbox" value="leaves" class="fx-option" checked> Постоянный Листопад</label>
      <label class="checkbox-item"><input type="checkbox" value="ashes" class="fx-option" checked> Тлеющий Пепел</label>
      <label class="checkbox-item"><input type="checkbox" value="stars" class="fx-option"> Звездопад</label>
    </div>

    <div class="section-title">Цвета и Динамика</div>
    <div class="control-row">
      <label>Цвет текста</label>
      <input type="color" id="textColor" value="#ffffff">
    </div>
    <div class="control-row">
      <label>Цвет искр / дождя</label>
      <input type="color" id="sparkColor" value="#00ffff">
    </div>
    <div class="control-row">
      <label>Интенсивность фона</label>
      <input type="range" id="sparkCount" min="5" max="100" value="50">
    </div>
    <div class="control-row">
      <label>Скорость частичек</label>
      <input type="range" id="sparkVelocity" min="1" max="15" value="6">
    </div>
  </div>

  <div class="main-content">
    <div class="preview-container" id="previewContainer">
      <canvas id="fxCanvas"></canvas>
      <div class="text-container" id="textContainer"></div>
    </div>

    <div class="code-panel">
      <div class="code-buttons">
        <button class="btn-action" onclick="copyCode()">Скопировать HTML-код</button>
        <button class="btn-action" onclick="copyGeniallyCode()">Код для Genially (iframe srcdoc)</button>
      </div>
      <textarea id="codeOutput" readonly></textarea>
    </div>
  </div>

  <script>
    const LOCALES = {
      ru: "живой текст …",
      en: "living text …",
      de: "lebender Text …",
      fr: "texte vivant …"
    };

    const inputs = {
      text: document.getElementById('textInput'),
      fontFamily: document.getElementById('fontFamily'),
      fontSize: document.getElementById('fontSize'),
      textColor: document.getElementById('textColor'),
      glowColor1: document.getElementById('glowColor1'),
      glowColor2: document.getElementById('glowColor2'),
      sparkColor: document.getElementById('sparkColor'),
      sparkCount: document.getElementById('sparkCount'),
      sparkVelocity: document.getElementById('sparkVelocity'),
      enableGlow: document.getElementById('enableGlow'),
      enableShadow: document.getElementById('enableShadow')
    };

    const textContainer = document.getElementById('textContainer');
    const previewContainer = document.getElementById('previewContainer');
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    const root = document.documentElement;
    const codeOutput = document.getElementById('codeOutput');

    let particles = [];

    function getSelectedFX() {
      return Array.from(document.querySelectorAll('.fx-option:checked')).map(cb => cb.value);
    }

    function resizeCanvas() {
      canvas.width = previewContainer.offsetWidth;
      canvas.height = previewContainer.offsetHeight;
    }

    function renderText() {
      textContainer.innerHTML = '';
      const str = inputs.text.value;
      const activeFX = getSelectedFX();

      for (let char of str) {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = char === ' ' ? '\u00A0' : char;

        if (inputs.enableShadow.checked) span.classList.add('has-shadow');
        if (inputs.enableGlow.checked) span.classList.add('has-glow');
        if (activeFX.includes('shake')) span.classList.add('fx-shake');

        attachCharEvents(span);
        textContainer.appendChild(span);
      }
    }

    function attachCharEvents(span) {
      span.addEventListener('mousemove', (e) => {
        const activeFX = getSelectedFX();
        const speed = parseFloat(inputs.sparkVelocity.value);

        if (activeFX.includes('scared')) {
          const rect = span.getBoundingClientRect();
          const angle = Math.atan2(e.clientY - (rect.top + rect.height / 2), e.clientX - (rect.left + rect.width / 2));
          span.style.transform = `translate(${ -Math.cos(angle) * speed * 10 }px, ${ -Math.sin(angle) * speed * 10 }px)`;
        }

        if (activeFX.includes('melt')) span.classList.add('fx-melted');

        if (activeFX.includes('sparks')) {
          const rect = previewContainer.getBoundingClientRect();
          spawnSpark(e.clientX - rect.left, e.clientY - rect.top);
        }
      });

      span.addEventListener('mouseleave', () => {
        if (getSelectedFX().includes('scared')) {
          setTimeout(() => { span.style.transform = 'translate(0, 0)'; }, 300);
        }
      });
    }

    function spawnSpark(x, y) {
      const color = inputs.sparkColor.value;
      const speed = parseFloat(inputs.sparkVelocity.value);
      for (let i = 0; i < 3; i++) {
        const angle = Math.random() * Math.PI * 2;
        const v = Math.random() * speed + 2;
        particles.push({
          type: 'spark',
          x, y,
          vx: Math.cos(angle) * v,
          vy: Math.sin(angle) * v,
          size: Math.random() * 4 + 2,
          color,
          life: 1,
          decay: Math.random() * 0.04 + 0.02
        });
      }
    }

    function generateAmbientParticles() {
      const activeFX = getSelectedFX();
      const intensity = parseInt(inputs.sparkCount.value) / 100;
      const speed = parseFloat(inputs.sparkVelocity.value);
      const w = canvas.width;
      const h = canvas.height;

      const rect = textContainer.getBoundingClientRect();
      const pRect = previewContainer.getBoundingClientRect();
      const textArea = {
        left: rect.left - pRect.left - 20,
        right: rect.right - pRect.left + 20,
        top: rect.top - pRect.top - 20,
        bottom: rect.bottom - pRect.top + 20
      };

      if (Math.random() > intensity) return;

      if (activeFX.includes('snow')) {
        particles.push({
          type: 'snow',
          x: Math.random() * w,
          y: -10,
          vy: Math.random() * speed * 0.5 + 1,
          vx: (Math.random() - 0.5) * 1,
          size: Math.random() * 3 + 2,
          color: inputs.sparkColor.value,
          life: 1
        });
      }

      if (activeFX.includes('rain')) {
        particles.push({
          type: 'rain',
          x: Math.random() * w,
          y: -20,
          vy: Math.random() * speed * 2 + 8,
          len: Math.random() * 12 + 10,
          color: inputs.sparkColor.value,
          life: 1
        });
      }

      if (activeFX.includes('fire')) {
        particles.push({
          type: 'fire',
          x: textArea.left + Math.random() * (textArea.right - textArea.left),
          y: textArea.bottom,
          vy: -(Math.random() * speed * 0.8 + 2),
          vx: (Math.random() - 0.5) * 1.5,
          size: Math.random() * 8 + 4,
          life: 1,
          decay: Math.random() * 0.02 + 0.015
        });
      }

      if (activeFX.includes('leaves')) {
        particles.push({
          type: 'leaf',
          x: Math.random() * w,
          y: -15,
          vy: Math.random() * speed * 0.4 + 1,
          vx: Math.sin(Date.now() / 300) * 1.5,
          size: Math.random() * 6 + 10,
          char: ['🍂', '🍁', '🍃'][Math.floor(Math.random() * 3)],
          life: 1
        });
      }

      if (activeFX.includes('ashes')) {
        particles.push({
          type: 'ashes',
          x: Math.random() * w,
          y: h + 10,
          vy: -(Math.random() * speed * 0.5 + 1),
          vx: (Math.random() - 0.5) * 1,
          size: Math.random() * 3 + 1,
          life: 1,
          decay: Math.random() * 0.015 + 0.008
        });
      }

      if (activeFX.includes('stars')) {
        particles.push({
          type: 'star',
          x: Math.random() * w,
          y: Math.random() * h,
          size: Math.random() * 4 + 2,
          color: inputs.sparkColor.value,
          life: 1,
          decay: Math.random() * 0.04 + 0.01
        });
      }
    }

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      generateAmbientParticles();

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];

        if (p.type === 'spark') {
          p.x += p.vx; p.y += p.vy; p.life -= p.decay;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0, p.size * p.life), 0, Math.PI * 2);
          ctx.fill();
        } 
        else if (p.type === 'snow') {
          p.y += p.vy; p.x += p.vx;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          if (p.y > canvas.height) p.life = 0;
        } 
        else if (p.type === 'rain') {
          p.y += p.vy;
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x, p.y + p.len);
          ctx.stroke();
          if (p.y > canvas.height) p.life = 0;
        } 
        else if (p.type === 'fire') {
          p.y += p.vy; p.x += p.vx; p.life -= p.decay;
          ctx.fillStyle = `rgba(255, ${Math.floor(p.life * 200)}, 0, ${Math.max(0, p.life)})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0, p.size * p.life), 0, Math.PI * 2);
          ctx.fill();
        } 
        else if (p.type === 'leaf') {
          p.y += p.vy; p.x += p.vx;
          ctx.font = `${p.size}px sans-serif`;
          ctx.fillText(p.char, p.x, p.y);
          if (p.y > canvas.height) p.life = 0;
        } 
        else if (p.type === 'ashes') {
          p.y += p.vy; p.x += p.vx; p.life -= p.decay;
          ctx.fillStyle = `rgba(180, 180, 180, ${Math.max(0, p.life)})`;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        } 
        else if (p.type === 'star') {
          p.life -= p.decay;
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.font = `${p.size * 3}px sans-serif`;
          ctx.fillText('★', p.x, p.y);
          ctx.globalAlpha = 1.0;
        }

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(renderLoop);
    }

    function getBaseHTML() {
      const activeFX = JSON.stringify(getSelectedFX());
      return `<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Manrope:wght@700&family=Montserrat:wght@700&family=Rubik:wght@700&display=swap" rel="stylesheet">
<div id="FX_STUDIO_ROOT" style="position:relative; width:100%; height:100%; min-height:250px; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#08090e;">
  <style>
    #FX_STUDIO_ROOT {
      --font-family: ${inputs.fontFamily.value};
      --font-size: ${inputs.fontSize.value}px;
      --text-color: ${inputs.textColor.value};
      --glow-color-1: ${inputs.glowColor1.value};
      --glow-color-2: ${inputs.glowColor2.value};
    }

    .text-container {
      position: relative;
      z-index: 2;
      display: inline-block;
      text-align: center;
      font-family: var(--font-family);
      font-size: var(--font-size);
      color: var(--text-color);
      font-weight: bold;
      user-select: none;
      white-space: pre-wrap;
    }

    #fxRootCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .char {
      display: inline-block;
      position: relative;
      transition: transform 0.15s ease-out, color 0.3s, filter 0.3s, opacity 0.5s;
      cursor: pointer;
    }

    .has-shadow { text-shadow: 3px 5px 10px rgba(0, 0, 0, 0.8); }
    .has-glow { filter: drop-shadow(0 0 12px var(--glow-color-1)) drop-shadow(0 0 25px var(--glow-color-2)); }

    .char.fx-shake:hover { animation: charShake 0.08s infinite alternate; }
    @keyframes charShake {
      0% { transform: translate(-3px, -2px) rotate(-4deg); }
      100% { transform: translate(3px, 2px) rotate(4deg); }
    }

    .char.fx-melted {
      transform: translateY(50px) scaleY(0.05) scaleX(2) !important;
      opacity: 0 !important;
      filter: blur(8px) brightness(2) !important;
      pointer-events: none;
    }
  </style>

  <canvas id="fxRootCanvas"></canvas>
  <div class="text-container" id="fxRootText"></div>

  <script>
    (function() {
      const root = document.getElementById('FX_STUDIO_ROOT');
      const container = document.getElementById('fxRootText');
      const canvas = document.getElementById('fxRootCanvas');
      const ctx = canvas.getContext('2d');

      const text = "${inputs.text.value.replace(/"/g, '\\"').replace(/\n/g, '')}";
      const activeFX = ${activeFX};
      const speed = ${inputs.sparkVelocity.value};
      const count = ${inputs.sparkCount.value};
      const sparkColor = "${inputs.sparkColor.value}";
      const hasShadow = ${inputs.enableShadow.checked};
      const hasGlow = ${inputs.enableGlow.checked};

      let particles = [];

      function resize() {
        canvas.width = root.offsetWidth;
        canvas.height = root.offsetHeight;
      }

      for (let char of text) {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = char === ' ' ? '\u00A0' : char;

        if (hasShadow) span.classList.add('has-shadow');
        if (hasGlow) span.classList.add('has-glow');
        if (activeFX.includes('shake')) span.classList.add('fx-shake');

        span.addEventListener('mousemove', (e) => {
          if (activeFX.includes('scared')) {
            const rect = span.getBoundingClientRect();
            const angle = Math.atan2(e.clientY - (rect.top + rect.height/2), e.clientX - (rect.left + rect.width/2));
            span.style.transform = \`translate(\${-Math.cos(angle) * speed * 10}px, \${-Math.sin(angle) * speed * 10}px)\`;
          }
          if (activeFX.includes('melt')) span.classList.add('fx-melted');
          if (activeFX.includes('sparks')) {
            const rect = root.getBoundingClientRect();
            for(let i=0; i<3; i++) {
              const a = Math.random() * Math.PI * 2, v = Math.random() * speed + 2;
              particles.push({
                type: 'spark', x: e.clientX - rect.left, y: e.clientY - rect.top,
                vx: Math.cos(a)*v, vy: Math.sin(a)*v, size: Math.random()*4+2,
                color: sparkColor, life: 1, decay: Math.random()*0.04+0.02
              });
            }
          }
        });

        if (activeFX.includes('scared')) {
          span.addEventListener('mouseleave', () => {
            setTimeout(() => { span.style.transform = 'translate(0, 0)'; }, 300);
          });
        }

        container.appendChild(span);
      }

      resize();
      window.addEventListener('resize', resize);

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const intensity = count / 100;
        const w = canvas.width, h = canvas.height;

        const rect = container.getBoundingClientRect();
        const rRect = root.getBoundingClientRect();
        const textArea = {
          left: rect.left - rRect.left - 20,
          right: rect.right - rRect.left + 20,
          top: rect.top - rRect.top - 20,
          bottom: rect.bottom - rRect.top + 20
        };

        if (Math.random() < intensity) {
          if (activeFX.includes('snow')) particles.push({ type: 'snow', x: Math.random()*w, y: -10, vy: Math.random()*speed*0.5+1, vx: (Math.random()-0.5), size: Math.random()*3+2, color: sparkColor, life: 1 });
          if (activeFX.includes('rain')) particles.push({ type: 'rain', x: Math.random()*w, y: -20, vy: Math.random()*speed*2+8, len: Math.random()*12+10, color: sparkColor, life: 1 });
          if (activeFX.includes('fire')) particles.push({ type: 'fire', x: textArea.left + Math.random()*(textArea.right - textArea.left), y: textArea.bottom, vy: -(Math.random()*speed*0.8+2), vx: (Math.random()-0.5)*1.5, size: Math.random()*8+4, life: 1, decay: Math.random()*0.02+0.015 });
          if (activeFX.includes('leaves')) particles.push({ type: 'leaf', x: Math.random()*w, y: -15, vy: Math.random()*speed*0.4+1, vx: Math.sin(Date.now()/300)*1.5, size: Math.random()*6+10, char: ['🍂','🍁','🍃'][Math.floor(Math.random()*3)], life: 1 });
          if (activeFX.includes('ashes')) particles.push({ type: 'ashes', x: Math.random()*w, y: h+10, vy: -(Math.random()*speed*0.5+1), vx: (Math.random()-0.5), size: Math.random()*3+1, life: 1, decay: Math.random()*0.015+0.008 });
          if (activeFX.includes('stars')) particles.push({ type: 'star', x: Math.random()*w, y: Math.random()*h, size: Math.random()*4+2, color: sparkColor, life: 1, decay: Math.random()*0.04+0.01 });
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          let p = particles[i];
          if (p.type === 'spark') {
            p.x += p.vx; p.y += p.vy; p.life -= p.decay;
            ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, p.size*p.life), 0, Math.PI*2); ctx.fill();
          } else if (p.type === 'snow') {
            p.y += p.vy; p.x += p.vx; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            if (p.y > h) p.life = 0;
          } else if (p.type === 'rain') {
            p.y += p.vy; ctx.strokeStyle = p.color; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y+p.len); ctx.stroke();
            if (p.y > h) p.life = 0;
          } else if (p.type === 'fire') {
            p.y += p.vy; p.x += p.vx; p.life -= p.decay;
            ctx.fillStyle = \`rgba(255, \${Math.floor(p.life*200)}, 0, \${Math.max(0, p.life)})\`;
            ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, p.size*p.life), 0, Math.PI*2); ctx.fill();
          } else if (p.type === 'leaf') {
            p.y += p.vy; p.x += p.vx; ctx.font = \`\${p.size}px sans-serif\`; ctx.fillText(p.char, p.x, p.y);
            if (p.y > h) p.life = 0;
          } else if (p.type === 'ashes') {
            p.y += p.vy; p.x += p.vx; p.life -= p.decay; ctx.fillStyle = \`rgba(180, 180, 180, \${Math.max(0, p.life)})\`; ctx.fillRect(p.x, p.y, p.size, p.size);
          } else if (p.type === 'star') {
            p.life -= p.decay; ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); ctx.font = \`\${p.size*3}px sans-serif\`; ctx.fillText('★', p.x, p.y); ctx.globalAlpha = 1.0;
          }
          if (p.life <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(loop);
      }
      loop();
    })();
  <\/script>
</div>`;
    }

    function updateFX() {
      root.style.setProperty('--font-family', inputs.fontFamily.value);
      root.style.setProperty('--font-size', inputs.fontSize.value + 'px');
      root.style.setProperty('--text-color', inputs.textColor.value);
      root.style.setProperty('--glow-color-1', inputs.glowColor1.value);
      root.style.setProperty('--glow-color-2', inputs.glowColor2.value);

      renderText();
      codeOutput.value = getBaseHTML();
    }

    Object.values(inputs).forEach(input => input.addEventListener('input', updateFX));
    document.querySelectorAll('.fx-option').forEach(cb => cb.addEventListener('change', updateFX));

    function setLang(lang, btn) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (LOCALES[lang]) {
        inputs.text.value = LOCALES[lang];
        updateFX();
      }
    }

    function copyCode() {
      codeOutput.value = getBaseHTML();
      codeOutput.select();
      document.execCommand('copy');
      alert('HTML-код скопирован!');
    }

    function copyGeniallyCode() {
      const rawHTML = getBaseHTML();
      const escapedHTML = rawHTML
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const geniallyIframe = `<iframe width="100%" height="350" frameborder="0" scrolling="no" srcdoc="${escapedHTML}"></iframe>`;
      codeOutput.value = geniallyIframe;
      codeOutput.select();
      document.execCommand('copy');
      alert('Код для Genially скопирован!');
    }

    window.addEventListener('resize', resizeCanvas);
    
    resizeCanvas();
    updateFX();
    renderLoop();
  </script>
</body>
</html>

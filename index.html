<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Letter Effects FX Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Manrope:wght@700&family=Montserrat:wght@700&family=Rubik:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-family: 'Comfortaa', cursive;
      --font-size: 60px;
      --text-color: #ffffff;
      --glow-gold: #ffd700;
      --glow-orange: #ff8c00;
      --spark-count: 35;
      --spark-velocity: 8;
      --spark-color: #00FFFF;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #11141c;
      color: #e0e6ed;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Боковая панель */
    .sidebar {
      width: 330px;
      background: #151821;
      border-right: 1px solid #222634;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8fa0b5;
      margin-top: 8px;
      margin-bottom: 4px;
      padding-bottom: 6px;
      border-bottom: 1px solid #222634;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .control-row label {
      font-size: 13px;
      color: #c5d1e0;
      white-space: nowrap;
    }

    .control-row input[type="text"],
    .control-row select {
      background: #1e2230;
      border: 1px solid #2d3346;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      width: 160px;
    }

    .control-row input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid #2d3346;
      width: 32px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    .control-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .control-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

    .control-row input[type="range"] {
      width: 140px;
      accent-color: #4d7cff;
      height: 4px;
    }

    .lang-group {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .lang-btn {
      flex: 1;
      background: #1e2230;
      color: #8fa0b5;
      border: 1px solid #2d3346;
      padding: 6px 0;
      cursor: pointer;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
      transition: 0.2s;
    }

    .lang-btn.active, .lang-btn:hover {
      background: #4d7cff;
      color: #fff;
      border-color: #4d7cff;
    }

    /* Правая часть */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d13;
      position: relative;
      overflow: hidden;
    }

    /* Обертка текста */
    .text-container {
      display: inline-block;
      text-align: center;
      padding: 20px;
      font-family: var(--font-family);
      font-size: var(--font-size);
      color: var(--text-color);
      font-weight: bold;
      user-select: none;
      white-space: pre-wrap;
    }

    /* Стили отдельных букв */
    .char {
      display: inline-block;
      position: relative;
      transition: transform 0.2s ease, color 0.3s ease, filter 0.3s ease, opacity 0.5s ease;
      cursor: pointer;
    }

    /* Эффект: Дрожание */
    .char.fx-shake:hover {
      animation: charShake 0.1s infinite alternate;
    }

    @keyframes charShake {
      0% { transform: translate(-2px, -2px) rotate(-3deg); }
      100% { transform: translate(2px, 2px) rotate(3deg); }
    }

    /* Эффект: Возгорание */
    .char.fx-fire:hover {
      color: #ffcc00 !important;
      text-shadow: 0 0 8px #ff4500, 0 0 15px #ff0000;
      animation: charBurn 0.2s infinite alternate;
    }

    @keyframes charBurn {
      0% { filter: drop-shadow(0 0 2px #ff4500); }
      100% { filter: drop-shadow(0 -5px 8px #ff8c00); }
    }

    /* Эффект: Лед */
    .char.fx-ice:hover {
      color: #a5f2f3 !important;
      text-shadow: 0 0 10px #00d2ff, 0 0 20px #ffffff;
      filter: brightness(1.3);
      transform: scale(1.05);
    }

    /* Эффект: Таяние */
    .char.fx-melted {
      transform: translateY(40px) scaleY(0.1) scaleX(1.5) !important;
      opacity: 0 !important;
      filter: blur(4px) !important;
      pointer-events: none;
    }

    .fx-particle {
      position: absolute;
      pointer-events: none;
      z-index: 9999;
    }

    /* Панель Кода */
    .code-panel {
      height: 200px;
      background: #151821;
      border-top: 1px solid #222634;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .code-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background: #232838;
      color: #fff;
      border: 1px solid #333a52;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-action:hover {
      background: #4d7cff;
      border-color: #4d7cff;
    }

    textarea {
      flex: 1;
      background: #0b0d13;
      border: 1px solid #222634;
      color: #729fcf;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      resize: none;
      border-radius: 4px;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="section-title">Язык интерфейса</div>
    <div class="lang-group">
      <button class="lang-btn active" onclick="setLang('ru', this)">Русский</button>
      <button class="lang-btn" onclick="setLang('en', this)">English</button>
      <button class="lang-btn" onclick="setLang('de', this)">Deutsch</button>
      <button class="lang-btn" onclick="setLang('fr', this)">Français</button>
    </div>

    <div class="section-title">Текст и Шрифт</div>
    <div class="control-row">
      <label>Текст надписи</label>
      <input type="text" id="textInput" value="очередная попытка …">
    </div>
    <div class="control-row">
      <label>Шрифт</label>
      <select id="fontFamily">
        <option value="'Comfortaa', cursive">Comfortaa</option>
        <option value="system-ui, sans-serif">Системный</option>
        <option value="'Rubik', sans-serif">Rubik</option>
        <option value="'Manrope', sans-serif">Manrope</option>
        <option value="'Montserrat', sans-serif">Montserrat</option>
      </select>
    </div>
    <div class="control-row">
      <label>Размер текста</label>
      <input type="range" id="fontSize" min="20" max="120" value="60">
    </div>

    <div class="section-title">Эффект при наведении</div>
    <div class="control-row">
      <label>Тип эффекта</label>
      <select id="fxType">
        <option value="scared">Трусливые буквы</option>
        <option value="shake">Дрожание букв</option>
        <option value="fire">Возгорание букв</option>
        <option value="ice">Покрываются льдом</option>
        <option value="leaves">Падают листья</option>
        <option value="melt">Буквы тают (исчезают)</option>
        <option value="sparks">Рассыпаются искры</option>
        <option value="snow">Падает снег</option>
        <option value="rain">Капли дождя</option>
        <option value="stars">Звездопад</option>
        <option value="ashes">Тлеют как пепел</option>
      </select>
    </div>

    <div class="section-title">Свечение и Цвет</div>
    <div class="control-row">
      <label>Цвет текста</label>
      <input type="color" id="textColor" value="#ffffff">
    </div>
    <div class="control-row">
      <label>Основное свечение</label>
      <input type="color" id="glowGold" value="#ffd700">
    </div>
    <div class="control-row">
      <label>Вторичное свечение</label>
      <input type="color" id="glowOrange" value="#ff8c00">
    </div>

    <div class="section-title">Параметры Эффекта</div>
    <div class="control-row">
      <label>Количество частиц</label>
      <input type="range" id="sparkCount" min="5" max="100" value="35">
    </div>
    <div class="control-row">
      <label>Скорость / Дальность</label>
      <input type="range" id="sparkVelocity" min="2" max="20" value="8">
    </div>
    <div class="control-row">
      <label>Цвет частиц</label>
      <input type="color" id="sparkColor" value="#00FFFF">
    </div>
  </div>

  <div class="main-content">
    <div class="preview-container">
      <div class="text-container" id="textContainer"></div>
    </div>

    <div class="code-panel">
      <div class="code-buttons">
        <button class="btn-action" onclick="copyCode()">Скопировать HTML-код</button>
        <button class="btn-action" onclick="copyGeniallyCode()">Код для Genially (iframe srcdoc)</button>
      </div>
      <textarea id="codeOutput" readonly></textarea>
    </div>
  </div>

  <script>
    const LOCALES = {
      ru: "очередная попытка …",
      en: "another attempt …",
      de: "Ein weiterer Versuch …",
      fr: "Une autre tentative …"
    };

    const inputs = {
      text: document.getElementById('textInput'),
      fontFamily: document.getElementById('fontFamily'),
      fontSize: document.getElementById('fontSize'),
      fxType: document.getElementById('fxType'),
      textColor: document.getElementById('textColor'),
      glowGold: document.getElementById('glowGold'),
      glowOrange: document.getElementById('glowOrange'),
      sparkCount: document.getElementById('sparkCount'),
      sparkVelocity: document.getElementById('sparkVelocity'),
      sparkColor: document.getElementById('sparkColor')
    };

    const textContainer = document.getElementById('textContainer');
    const root = document.documentElement;
    const codeOutput = document.getElementById('codeOutput');

    function renderText() {
      textContainer.innerHTML = '';
      const str = inputs.text.value;
      const fx = inputs.fxType.value;

      for (let char of str) {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = char === ' ' ? '\u00A0' : char;

        if (fx === 'shake') span.classList.add('fx-shake');
        if (fx === 'fire') span.classList.add('fx-fire');
        if (fx === 'ice') span.classList.add('fx-ice');

        attachCharEvents(span);
        textContainer.appendChild(span);
      }
    }

    function attachCharEvents(span) {
      span.addEventListener('mousemove', (e) => {
        const fx = inputs.fxType.value;
        const speed = parseFloat(inputs.sparkVelocity.value);
        const color = inputs.sparkColor.value;

        // Трусливые буквы
        if (fx === 'scared') {
          const rect = span.getBoundingClientRect();
          const charCenterX = rect.left + rect.width / 2;
          const charCenterY = rect.top + rect.height / 2;
          const deltaX = e.clientX - charCenterX;
          const deltaY = e.clientY - charCenterY;
          const angle = Math.atan2(deltaY, deltaX);
          const dist = speed * 8;
          
          span.style.transform = `translate(${ -Math.cos(angle) * dist }px, ${ -Math.sin(angle) * dist }px)`;
        }

        // Буквы тают
        if (fx === 'melt') {
          span.classList.add('fx-melted');
        }

        // Спавн частиц для эффектов
        if (['leaves', 'fire', 'sparks', 'snow', 'rain', 'stars', 'ashes'].includes(fx)) {
          if (Math.random() < (parseInt(inputs.sparkCount.value) / 100)) {
            spawnParticle(e.clientX, e.clientY, fx, speed, color);
          }
        }
      });

      span.addEventListener('mouseleave', () => {
        const fx = inputs.fxType.value;
        if (fx === 'scared') {
          setTimeout(() => { span.style.transform = 'translate(0, 0)'; }, 300);
        }
      });
    }

    function spawnParticle(x, y, type, speed, color) {
      const p = document.createElement('div');
      p.className = 'fx-particle';
      document.body.appendChild(p);

      let destX = 0, destY = 0, duration = 600, keyframes = [];

      if (type === 'leaves') {
        p.innerText = ['🍂', '🍁'][Math.floor(Math.random() * 2)];
        p.style.fontSize = (Math.random() * 8 + 12) + 'px';
        destX = (Math.random() - 0.5) * speed * 8;
        destY = Math.random() * speed * 12 + 20;
        duration = 800 + Math.random() * 400;
        keyframes = [
          { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
          { transform: `translate(${destX}px, ${destY}px) rotate(180deg)`, opacity: 0 }
        ];
      } else if (type === 'fire') {
        p.style.width = '6px'; p.style.height = '6px'; p.style.borderRadius = '50%';
        p.style.background = '#ff4500';
        p.style.boxShadow = '0 0 8px #ff8c00';
        destX = (Math.random() - 0.5) * 15;
        destY = -(Math.random() * speed * 10 + 15);
        duration = 400 + Math.random() * 300;
        keyframes = [
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: `translate(${destX}px, ${destY}px) scale(0.2)`, opacity: 0 }
        ];
      } else if (type === 'sparks') {
        p.style.width = '4px'; p.style.height = '4px'; p.style.borderRadius = '50%';
        p.style.background = color; p.style.boxShadow = '0 0 6px ' + color;
        const angle = Math.random() * Math.PI * 2;
        const v = Math.random() * speed + 2;
        keyframes = [
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: `translate(${Math.cos(angle)*v*15}px, ${Math.sin(angle)*v*15}px) scale(0)`, opacity: 0 }
        ];
      } else if (type === 'snow') {
        p.innerText = '❄'; p.style.color = color; p.style.fontSize = '12px';
        destX = (Math.random() - 0.5) * 30; destY = Math.random() * speed * 10 + 20;
        keyframes = [
          { transform: 'translate(0, 0)', opacity: 1 },
          { transform: `translate(${destX}px, ${destY}px)`, opacity: 0 }
        ];
      } else if (type === 'rain') {
        p.style.width = '2px'; p.style.height = '12px'; p.style.background = color;
        destY = Math.random() * speed * 15 + 30;
        keyframes = [
          { transform: 'translate(0, 0)', opacity: 0.8 },
          { transform: `translate(0, ${destY}px)`, opacity: 0 }
        ];
      } else if (type === 'stars') {
        p.innerText = '★'; p.style.color = color; p.style.fontSize = '10px';
        const angle = Math.random() * Math.PI * 2;
        keyframes = [
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: `translate(${Math.cos(angle)*speed*10}px, ${Math.sin(angle)*speed*10}px) scale(0)`, opacity: 0 }
        ];
      } else if (type === 'ashes') {
        p.style.width = '3px'; p.style.height = '3px'; p.style.background = color;
        destX = (Math.random() - 0.5) * 20; destY = -(Math.random() * speed * 8 + 10);
        keyframes = [
          { transform: 'translate(0, 0)', opacity: 0.7 },
          { transform: `translate(${destX}px, ${destY}px)`, opacity: 0 }
        ];
      }

      p.style.left = x + 'px';
      p.style.top = y + 'px';

      const anim = p.animate(keyframes, { duration: duration, easing: 'ease-out', fill: 'forwards' });
      anim.onfinish = () => p.remove();
    }

    function getBaseHTML() {
      return `<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Manrope:wght@700&family=Montserrat:wght@700&family=Rubik:wght@700&display=swap" rel="stylesheet">
<div id="FX_ROOT">
  <style>
    :root {
      --font-family: ${inputs.fontFamily.value};
      --font-size: ${inputs.fontSize.value}px;
      --text-color: ${inputs.textColor.value};
    }

    .text-container {
      display: inline-block;
      text-align: center;
      padding: 20px;
      font-family: var(--font-family);
      font-size: var(--font-size);
      color: var(--text-color);
      font-weight: bold;
      user-select: none;
      white-space: pre-wrap;
    }

    .char {
      display: inline-block;
      position: relative;
      transition: transform 0.2s ease, color 0.3s ease, filter 0.3s ease, opacity 0.5s ease;
      cursor: pointer;
    }

    .char.fx-shake:hover { animation: charShake 0.1s infinite alternate; }
    @keyframes charShake {
      0% { transform: translate(-2px, -2px) rotate(-3deg); }
      100% { transform: translate(2px, 2px) rotate(3deg); }
    }

    .char.fx-fire:hover {
      color: #ffcc00 !important;
      text-shadow: 0 0 8px #ff4500, 0 0 15px #ff0000;
      animation: charBurn 0.2s infinite alternate;
    }
    @keyframes charBurn {
      0% { filter: drop-shadow(0 0 2px #ff4500); }
      100% { filter: drop-shadow(0 -5px 8px #ff8c00); }
    }

    .char.fx-ice:hover {
      color: #a5f2f3 !important;
      text-shadow: 0 0 10px #00d2ff, 0 0 20px #ffffff;
      filter: brightness(1.3);
      transform: scale(1.05);
    }

    .char.fx-melted {
      transform: translateY(40px) scaleY(0.1) scaleX(1.5) !important;
      opacity: 0 !important;
      filter: blur(4px) !important;
      pointer-events: none;
    }

    .fx-particle {
      position: absolute;
      pointer-events: none;
      z-index: 9999;
    }
  </style>

  <div class="text-container" id="fxTextContainer"></div>

  <script>
    (function() {
      const container = document.getElementById('fxTextContainer');
      const text = "${inputs.text.value.replace(/"/g, '\\"').replace(/\n/g, '')}";
      const fx = "${inputs.fxType.value}";
      const speed = ${inputs.sparkVelocity.value};
      const count = ${inputs.sparkCount.value};
      const color = "${inputs.sparkColor.value}";

      for (let char of text) {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = char === ' ' ? '\u00A0' : char;

        if (fx === 'shake') span.classList.add('fx-shake');
        if (fx === 'fire') span.classList.add('fx-fire');
        if (fx === 'ice') span.classList.add('fx-ice');

        span.addEventListener('mousemove', (e) => {
          if (fx === 'scared') {
            const rect = span.getBoundingClientRect();
            const angle = Math.atan2(e.clientY - (rect.top + rect.height/2), e.clientX - (rect.left + rect.width/2));
            span.style.transform = \`translate(\${-Math.cos(angle) * speed * 8}px, \${-Math.sin(angle) * speed * 8}px)\`;
          }
          if (fx === 'melt') span.classList.add('fx-melted');

          if (['leaves', 'fire', 'sparks', 'snow', 'rain', 'stars', 'ashes'].includes(fx)) {
            if (Math.random() < (count / 100)) spawnP(e.clientX, e.clientY);
          }
        });

        if (fx === 'scared') {
          span.addEventListener('mouseleave', () => {
            setTimeout(() => { span.style.transform = 'translate(0, 0)'; }, 300);
          });
        }

        container.appendChild(span);
      }

      function spawnP(x, y) {
        const p = document.createElement('div');
        p.className = 'fx-particle';
        document.body.appendChild(p);

        let destX = 0, destY = 0, duration = 600, keyframes = [];

        if (fx === 'leaves') {
          p.innerText = ['🍂', '🍁'][Math.floor(Math.random() * 2)];
          p.style.fontSize = (Math.random() * 8 + 12) + 'px';
          destX = (Math.random() - 0.5) * speed * 8; destY = Math.random() * speed * 12 + 20;
          keyframes = [{ transform: 'translate(0, 0) rotate(0deg)', opacity: 1 }, { transform: \`translate(\${destX}px, \${destY}px) rotate(180deg)\`, opacity: 0 }];
        } else if (fx === 'fire') {
          p.style.width = '6px'; p.style.height = '6px'; p.style.borderRadius = '50%'; p.style.background = '#ff4500'; p.style.boxShadow = '0 0 8px #ff8c00';
          destX = (Math.random() - 0.5) * 15; destY = -(Math.random() * speed * 10 + 15);
          keyframes = [{ transform: 'translate(0, 0) scale(1)', opacity: 1 }, { transform: \`translate(\${destX}px, \${destY}px) scale(0.2)\`, opacity: 0 }];
        } else if (fx === 'sparks') {
          p.style.width = '4px'; p.style.height = '4px'; p.style.borderRadius = '50%'; p.style.background = color; p.style.boxShadow = '0 0 6px ' + color;
          const a = Math.random() * Math.PI * 2, v = Math.random() * speed + 2;
          keyframes = [{ transform: 'translate(0, 0) scale(1)', opacity: 1 }, { transform: \`translate(\${Math.cos(a)*v*15}px, \${Math.sin(a)*v*15}px) scale(0)\`, opacity: 0 }];
        } else if (fx === 'snow') {
          p.innerText = '❄'; p.style.color = color; p.style.fontSize = '12px';
          destX = (Math.random() - 0.5) * 30; destY = Math.random() * speed * 10 + 20;
          keyframes = [{ transform: 'translate(0, 0)', opacity: 1 }, { transform: \`translate(\${destX}px, \${destY}px)\`, opacity: 0 }];
        } else if (fx === 'rain') {
          p.style.width = '2px'; p.style.height = '12px'; p.style.background = color;
          destY = Math.random() * speed * 15 + 30;
          keyframes = [{ transform: 'translate(0, 0)', opacity: 0.8 }, { transform: \`translate(0, \${destY}px)\`, opacity: 0 }];
        } else if (fx === 'stars') {
          p.innerText = '★'; p.style.color = color; p.style.fontSize = '10px';
          const a = Math.random() * Math.PI * 2;
          keyframes = [{ transform: 'translate(0, 0) scale(1)', opacity: 1 }, { transform: \`translate(\${Math.cos(a)*speed*10}px, \${Math.sin(a)*speed*10}px) scale(0)\`, opacity: 0 }];
        } else if (fx === 'ashes') {
          p.style.width = '3px'; p.style.height = '3px'; p.style.background = color;
          destX = (Math.random() - 0.5) * 20; destY = -(Math.random() * speed * 8 + 10);
          keyframes = [{ transform: 'translate(0, 0)', opacity: 0.7 }, { transform: \`translate(\${destX}px, \${destY}px)\`, opacity: 0 }];
        }

        p.style.left = x + 'px'; p.style.top = y + 'px';
        const anim = p.animate(keyframes, { duration: 600, easing: 'ease-out', fill: 'forwards' });
        anim.onfinish = () => p.remove();
      }
    })();
  <\/script>
</div>`;
    }

    function updateFX() {
      root.style.setProperty('--font-family', inputs.fontFamily.value);
      root.style.setProperty('--font-size', inputs.fontSize.value + 'px');
      root.style.setProperty('--text-color', inputs.textColor.value);
      root.style.setProperty('--glow-gold', inputs.glowGold.value);
      root.style.setProperty('--glow-orange', inputs.glowOrange.value);
      root.style.setProperty('--spark-color', inputs.sparkColor.value);

      renderText();
      codeOutput.value = getBaseHTML();
    }

    Object.values(inputs).forEach(input => input.addEventListener('input', updateFX));

    function setLang(lang, btn) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (LOCALES[lang]) {
        inputs.text.value = LOCALES[lang];
        updateFX();
      }
    }

    function copyCode() {
      codeOutput.value = getBaseHTML();
      codeOutput.select();
      document.execCommand('copy');
      alert('HTML-код скопирован!');
    }

    function copyGeniallyCode() {
      const rawHTML = getBaseHTML();
      const escapedHTML = rawHTML
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const geniallyIframe = `<iframe width="100%" height="300" frameborder="0" scrolling="no" srcdoc="${escapedHTML}"></iframe>`;
      codeOutput.value = geniallyIframe;
      codeOutput.select();
      document.execCommand('copy');
      alert('Код для Genially скопирован!');
    }

    updateFX();
  </script>
</body>
</html>
